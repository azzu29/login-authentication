<!DOCTYPE html>
<html>

<head>
    <title>Add CEO</title>

    <style>
        body {
            background-color: #eaf7fa;
            font-family: Arial, sans-serif;
        }

        .form-container {
            width: 500px;
            margin: 50px auto;
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
        }

        .form-header {
            background-color: #b52b22;
            color: white;
            padding: 20px;
        }

        .form-header h2 {
            margin: 0;
        }

        form {
            padding: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
        }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #b52b22;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #8f211b;
        }
    </style>
</head>

<body>

    <div id="navbar-placeholder"></div>

    <div class="form-container">

        <div class="form-header">
            <h2>Add CEO</h2>
        </div>

        <form>

            <label>Name:</label>
            <input type="text" name="name" placeholder="Enter name">

            <label>Company Name:</label>
            <input type="text" name="company" placeholder="Enter company name">

            <label>University Details:</label>
            <input type="text" name="university" placeholder="Enter university details">

            <label>About:</label>
            <textarea name="about" placeholder="Enter about"></textarea>

            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter email">

            <label>Phone Number:</label>
            <input type="tel" name="phone" placeholder="Enter phone number">

            <button type="submit">Submit</button>

        </form>

    </div>

    <script src="navbar.js"></script>

</body>

</html>
